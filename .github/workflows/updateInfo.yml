name: Validate and Build BlogAI Directory

# Hosting and deployment are handled by Vercel (https://blogai.space).
# This workflow only validates and builds; it does not deploy.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Daily live SEO check (verify-live job), 06:00 UTC
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  validate-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run strict CSV linter
        run: python scripts/linter.py

      - name: Rebuild data and OPML
        run: python scripts/build_data.py

      - name: Compile first-party articles
        run: node scripts/build_articles.js

      - name: Check deterministic data generation
        run: |
          git status --porcelain
          git diff --exit-code src/data/ feed.opml || (echo "Generated data is not deterministic or not checked in!" && exit 1)

      - name: Run unit and integration tests
        run: npm test

      - name: Build production application & pre-render routes
        run: npm run build

      - name: Validate SEO metadata, canonicals, and sitemap
        run: python scripts/validate_seo.py

  # Check of the live site on blogai.space: every sitemap URL must answer 200 without a redirect,
  # be indexable and self-canonical. Runs daily and on manual runs, because Vercel deploys outside
  # this workflow. Enable it by setting the repository variable SITE_LIVE to "true"
  # (Settings -> Secrets and variables -> Actions -> Variables).
  verify-live:
    if: vars.SITE_LIVE == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check live sitemaps, status codes, canonicals and indexability
        run: python scripts/check_live_seo.py

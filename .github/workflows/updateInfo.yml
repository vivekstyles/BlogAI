name: Validate, Build, and Deploy BlogAI Directory

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run strict CSV linter
        run: python scripts/linter.py

      - name: Rebuild data and OPML
        run: python scripts/build_data.py

      - name: Compile first-party articles
        run: node scripts/build_articles.js

      - name: Check deterministic data generation
        run: |
          git status --porcelain
          git diff --exit-code src/data/ feed.opml || (echo "Generated data is not deterministic or not checked in!" && exit 1)

      - name: Run unit and integration tests
        run: npm test

      - name: Build production application & pre-render routes
        run: npm run build

      - name: Validate SEO metadata, canonicals, and sitemap
        run: python scripts/validate_seo.py

      - name: Upload production artifact for deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

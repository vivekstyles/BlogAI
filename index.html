<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js): queued now, the library loads after the page has rendered so it
         does not compete with the app bundle for bandwidth and main-thread time -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-R1K6E4R7WG');
      window.addEventListener('load', function () {
        var loadTag = function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-R1K6E4R7WG';
          document.head.appendChild(s);
        };
        if ('requestIdleCallback' in window) requestIdleCallback(loadTag, { timeout: 3000 });
        else setTimeout(loadTag, 1500);
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogAI - Curated Community Blog Directory</title>
    <meta
      name="description"
      content="Discover, search, and subscribe to quality blogs on AI, programming, engineering, math, physics, science, automotive tech, nutrition, and personal finance."
    />
    <link rel="canonical" href="https://blogai.space/" />
    <!-- Google Search favicons need a raster format; the SVG stays for browsers that prefer it -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="BlogAI Articles" href="/feed.xml" />
    <meta name="theme-color" content="#171717" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blogai.space/" />
    <meta property="og:title" content="BlogAI - Curated Community Blog Directory" />
    <meta
      property="og:description"
      content="Discover, search, and subscribe to quality blogs on AI, programming, engineering, math, physics, science, automotive tech, nutrition, and personal finance."
    />
    <meta property="og:site_name" content="BlogAI" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BlogAI - Curated Community Blog Directory" />
    <meta
      name="twitter:description"
      content="Discover, search, and subscribe to quality blogs on AI, programming, engineering, math, physics, science, automotive tech, nutrition, and personal finance."
    />

    <!-- Google Fonts, loaded without blocking first paint (font-display: swap falls back to system fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
